.siteHero.posterZoom:before,.siteHero.posterSplit:before,.siteHero.posterStack:before{content:"";position:absolute;width:min(68vw,520px);aspect-ratio:3/4;right:5%;top:8%;background:var(--poster-bg,linear-gradient(145deg,#ffd82f 0 44%,#ff526d 44% 71%,#f3eddf 71%));background-size:cover;background-position:center;box-shadow:0 25px 70px #000b}.siteHero.posterZoom:before{animation:sitePZoom 6s ease-in-out infinite alternate}@keyframes sitePZoom{to{transform:scale(1.22) rotate(4deg)}}.siteHero.posterSplit:before{animation:sitePSplit 4s ease-in-out infinite alternate}@keyframes sitePSplit{to{clip-path:inset(15% 12% 18% 10%);transform:rotate(8deg) scale(1.05)}}.siteHero.posterStack:before{box-shadow:-18px 12px 0 #52c8ff,-36px 24px 0 #7656ff,0 25px 70px #000b;animation:sitePStack 4s ease-in-out infinite alternate}@keyframes sitePStack{to{transform:translate(-25px,10px) rotate(-6deg)}}
.siteHero.slowfade .heroInner{animation:qSiteFade 3.4s ease both}@keyframes qSiteFade{from{opacity:0}to{opacity:1}}.siteHero.parallax:before{content:"";position:absolute;width:48%;height:52%;right:8%;top:17%;background:linear-gradient(145deg,#d2cdc2,#aba79f);animation:qParaImg 5s ease-in-out infinite alternate}.siteHero.parallax .heroInner{animation:qParaText 5s ease-in-out infinite alternate}@keyframes qParaImg{to{transform:translateY(18px)}}@keyframes qParaText{to{transform:translateY(-10px)}}.siteHero.focus:before{content:"";position:absolute;inset:11% 8% 18% 34%;background:linear-gradient(145deg,#d1ccc2,#aaa69e);filter:blur(14px);animation:qFocus 4.5s ease forwards}@keyframes qFocus{to{filter:blur(0)}}
.site.type .contentSec,.site.quiet .contentSec{border-top:1px solid #1112}.site.reveal .contentSec,.site.flow .contentSec,.site.poster .contentSec{border-top:1px solid #fff1}
@media(max-width:760px){.patterns,.resultGrid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full,.goPreview{grid-column:auto}.castGrid{grid-template-columns:1fr}.cat{min-height:440px}.siteNav .navlinks{display:none}.siteTitle{font-size:clamp(52px,17vw,94px)}.siteHero.posterZoom:before,.siteHero.posterSplit:before,.siteHero.posterStack:before{width:70vw;right:-15%;opacity:.76}.scrambleDisplay{font-size:clamp(52px,17vw,94px)}.choices{grid-template-columns:1fr}.openingLayer.typewriter .openingTitle{font-size:clamp(34px,11vw,76px)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CATS={
reveal:{name:'隠れて現れる',en:'REVEAL',desc:'最初は見えないものが、光・暗闇・裂け目などから現れます。ミステリー、幻想、ホラー、シリアス作品向け。',bg:'revealBg'},
flow:{name:'流れて変わる',en:'FLOW',desc:'色や形が画面を横切り、舞台転換のように景色が変わります。ダンス、音楽劇、抽象的な作品向け。',bg:'flowBg'},
type:{name:'言葉で魅せる',en:'TYPE',desc:'写真に頼らず、タイトルや言葉そのものを動かして作品の入口を作ります。会話劇、文芸、朗読に強い。',bg:'typeBg'},
poster:{name:'フライヤーを活かす',en:'POSTER',desc:'公演フライヤーを主役にした入口。すでにある宣伝ビジュアルを活かしたい公演向け。',bg:'posterBg'},
quiet:{name:'静かに魅せる',en:'QUIET',desc:'余白、写真、文字を丁寧に見せる静かな入口。会話劇、文芸、美術性の高い作品向け。',bg:'quietBg'}
};
const PATTERNS={
reveal:[
{id:'spotlight',name:'SPOTLIGHT',desc:'光が当たった場所から見える',demo:'demoSpot',fit:'ミステリー・幻想・夜の物語',traits:{mood:'dark',energy:'quiet',focus:'visual'}},
{id:'fadein',name:'FADE FROM DARK',desc:'暗闇からゆっくり浮かび上がる',demo:'demoFade',fit:'シリアス・会話劇・余韻のある作品',traits:{mood:'dark',energy:'quiet',focus:'words'}},
{id:'tear',name:'TEAR',desc:'黒い幕が裂けて作品が現れる',demo:'demoTear',fit:'サスペンス・不条理・強い題材',traits:{mood:'dark',energy:'powerful',focus:'visual'}}],
flow:[
{id:'wave',name:'WAVE',desc:'大きな波が画面を動かす',demo:'demoWave',fit:'ダンス・音楽劇・青春もの',traits:{mood:'bright',energy:'powerful',focus:'visual'}},
{id:'gradient',name:'GRADIENT',desc:'色の流れが絶えず変化する',demo:'demoGradient',fit:'ポップ・現代劇・音楽イベント',traits:{mood:'bright',energy:'quiet',focus:'visual'}},
{id:'ink',name:'INK',desc:'インクが広がり画面を満たす',demo:'demoInk',fit:'アート・抽象・少し不思議な作品',traits:{mood:'dark',energy:'powerful',focus:'visual'}}],
type:[
{id:'typewriter',name:'TYPEWRITER',desc:'タイトルを一文字ずつ打ち出す',demo:'demoType demoTypewriter',fit:'会話劇・朗読・文章を大切にする作品',traits:{mood:'dark',energy:'quiet',focus:'words'}},
{id:'letters',name:'FADE LETTERS',desc:'文字がばらけた状態から揃う',demo:'demoType demoLetters',fit:'文芸・詩的・繊細な作品',traits:{mood:'bright',energy:'quiet',focus:'words'}},
{id:'scramble',name:'SCRAMBLE',desc:'意味不明な文字が正しいタイトルになる',demo:'demoType demoScramble',fit:'実験劇・SF・テンポの速い作品',traits:{mood:'dark',energy:'powerful',focus:'words'}}],
poster:[
{id:'posterZoom',name:'ZOOM',desc:'ポスターへゆっくり近づく',demo:'demoPoster demoZoom',fit:'フライヤーの写真や絵が強い作品',traits:{mood:'dark',energy:'quiet',focus:'visual'}},
{id:'posterSplit',name:'SPLIT',desc:'フライヤーが切り取られたように変化する',demo:'demoPoster demoSplit',fit:'デザイン性が高い・エッジのある作品',traits:{mood:'bright',energy:'powerful',focus:'visual'}},
{id:'posterStack',name:'STACK',desc:'複数のポスターが重なって動く',demo:'demoPoster demoStack',fit:'ポップ・群像劇・賑やかな作品',traits:{mood:'bright',energy:'powerful',focus:'visual'}}],
quiet:[
{id:'slowfade',name:'SLOW FADE',desc:'何もない空間から静かに現れる',demo:'demoQuiet demoSlow',fit:'会話劇・文学・静かな人間ドラマ',traits:{mood:'dark',energy:'quiet',focus:'words'}},
{id:'parallax',name:'PARALLAX',desc:'写真と文字が少し違う速度で動く',demo:'demoQuiet demoParallax',fit:'写真を丁寧に見せたい作品・美術系',traits:{mood:'bright',energy:'quiet',focus:'visual'}},
{id:'focus',name:'FOCUS',desc:'ぼやけた世界にゆっくりピントが合う',demo:'demoQuiet demoFocus',fit:'記憶・家族・余韻を残す作品',traits:{mood:'dark',energy:'quiet',focus:'visual'}}]
};
const params=new URLSearchParams(location.search);
const app=document.getElementById('app');
const category=params.get('category');
const style=params.get('style');
const preview=params.get('preview');
const diagnose=params.get('diagnose');
const STORE='koensaito_draft_v15';
const POSTER_STORE='koensaito_poster_image_v1';
function makerHeader(){return `<header class="makerHead"><a href="./">公演サイトメーカー</a><span class="badge">試作版</span></header>`}
function allPatterns(){return Object.entries(PATTERNS).flatMap(([cat,list])=>list.map(p=>({...p,cat})))}
function findPattern(cat,id){return (PATTERNS[cat]||[]).find(p=>p.id===id)}
function demoHtml(cat,p){return `<div class="demo ${p.demo}">${cat==='poster'?'<span class="miniPoster"></span>':'<span>STAGE</span>'}</div>`}
function patternCard(cat,p,i,rank=''){return `<article class="pattern"><div><div class="num">${rank||`0${i+1}`}</div><h3>${p.name}</h3><p>${p.desc}</p><div class="fit"><b>こんな作品に</b>${p.fit}</div>${demoHtml(cat,p)}</div><a class="patternBtn" href="?category=${cat}&style=${p.id}">この演出を使う</a></article>`}
function home(){document.title='公演サイトメーカー';app.innerHTML=makerHeader()+`<main class="wrap"><section class="intro"><div class="kicker">舞台・公演向け</div><h1>公演の、<br>入口をつくる。</h1><p>フライヤーや公演情報を入れるだけ。SNSから来た人を数秒で作品世界へ連れていき、公式サイトや予約ページへつなぐティザーページを作ります。</p><div class="homeActions"><a class="homeBtn primary" href="?diagnose=1">作品の雰囲気からおすすめを見る</a><button class="homeBtn" id="randomBtn" type="button">おまかせで選ぶ 🎲</button></div><div class="randomBox" id="randomBox"></div></section><section class="categories">${Object.entries(CATS).map(([k,c],i)=>`<a class="cat ${c.bg}" href="?category=${k}"><div class="catIn"><div class="kicker">0${i+1} / ${c.en}</div><h2>${c.en}</h2><h3>${c.name}</h3><p>${c.desc}</p><span class="pill">3つの演出を見る →</span></div></a>`).join('')}</section></main>`;document.getElementById('randomBtn').addEventListener('click',rollRandom)}
function rollRandom(){const all=allPatterns();const pick=all[Math.floor(Math.random()*all.length)];const box=document.getElementById('randomBox');box.className='randomBox show';box.innerHTML=`<div class="randomTop"><div><div class="kicker">TODAY'S PICK / ${CATS[pick.cat].en}</div><h3>${pick.name}</h3><p>${pick.desc}</p><div class="fit"><b>こんな作品に</b>${pick.fit}</div></div></div>${demoHtml(pick.cat,pick)}<div class="randomActions"><button class="miniBtn" id="reroll" type="button">もう一回 🎲</button><a class="miniBtn primary" href="?category=${pick.cat}&style=${pick.id}">これで作ってみる →</a></div>`;applyPosterThumbs();document.getElementById('reroll').addEventListener('click',rollRandom);box.scrollIntoView({behavior:'smooth',block:'nearest'})}
function diagnosis(){document.title='作品に合う演出診断｜公演サイトメーカー';app.innerHTML=makerHeader()+`<main class="wrap"><section class="diagHero"><div class="kicker">3 QUESTIONS</div><h1>作品の空気から、<br>演出を選ぶ。</h1><p>3つだけ答えると、15種類の中から相性がよさそうな演出を3つ提案します。正解を決める診断ではなく、選ぶきっかけとして使ってください。</p><a class="backLink" href="./">← トップへ戻る</a></section><form class="quiz" id="quiz"><section class="question"><h3>01. 作品の空気はどちらに近い？</h3><div class="choices"><label class="choice"><input type="radio" name="mood" value="dark" required><span>暗い・不思議・シリアス</span></label><label class="choice"><input type="radio" name="mood" value="bright"><span>明るい・楽しい・開放的</span></label></div></section><section class="question"><h3>02. 動きの印象は？</h3><div class="choices"><label class="choice"><input type="radio" name="energy" value="quiet" required><span>静か・じっくり</span></label><label class="choice"><input type="radio" name="energy" value="powerful"><span>強い・勢いがある</span></label></div></section><section class="question"><h3>03. 何を一番印象に残したい？</h3><div class="choices"><label class="choice"><input type="radio" name="focus" value="visual" required><span>写真・フライヤー・色</span></label><label class="choice"><input type="radio" name="focus" value="words"><span>タイトル・言葉</span></label></div></section><button class="diagBtn" type="submit">おすすめ3つを見る →</button></form><section class="results" id="results"></section></main>`;document.getElementById('quiz').addEventListener('submit',e=>{e.preventDefault();showDiagnosis(Object.fromEntries(new FormData(e.currentTarget)))})}
function showDiagnosis(ans){const scored=allPatterns().map((p,idx)=>{let score=0;score+=p.traits.mood===ans.mood?4:0;score+=p.traits.energy===ans.energy?3:0;score+=p.traits.focus===ans.focus?4:0;if(p.cat==='poster'&&ans.focus==='visual')score+=1;if(p.cat==='type'&&ans.focus==='words')score+=1;return {...p,score,idx}}).sort((a,b)=>b.score-a.score||a.idx-b.idx).slice(0,3);const reasons={dark:'作品の暗さ・余韻',bright:'明るさ・開放感',quiet:'静かなテンポ',powerful:'強い動き',visual:'ビジュアル重視',words:'言葉重視'};const r=document.getElementById('results');r.className='results show';r.innerHTML=`<div class="kicker">RECOMMENDATION</div><h2 style="font-size:34px;letter-spacing:-.04em;margin:8px 0 18px">この3つから見るのがおすすめ</h2><div class="resultGrid">${scored.map((p,i)=>`<article class="resultCard"><div class="rank">0${i+1} / ${CATS[p.cat].en}</div><h3>${p.name}</h3><p>${p.desc}</p><div class="reason">${reasons[ans.mood]}・${reasons[ans.energy]}・${reasons[ans.focus]}との相性から選びました。</div><div class="fit"><b>こんな作品に</b>${p.fit}</div>${demoHtml(p.cat,p)}<a class="patternBtn" href="?category=${p.cat}&style=${p.id}">これで作ってみる</a></article>`).join('')}</div>`;applyPosterThumbs();r.scrollIntoView({behavior:'smooth'})}
function choose(cat){const c=CATS[cat];if(!c)return home();document.title=`${c.name}｜公演サイトメーカー`;app.innerHTML=makerHeader()+`<main class="wrap"><section class="selectHero"><div class="kicker">${c.en}</div><h1>${c.name}</h1><p>${c.desc}</p><a class="backLink" href="./">← 5つのジャンルへ戻る</a></section>${cat==='poster'?posterUploader():''}<section class="patterns">${PATTERNS[cat].map((p,i)=>patternCard(cat,p,i)).join('')}</section></main>`;if(cat==='poster')setupPosterUpload();applyPosterThumbs()}
function posterUploader(){const img=localStorage.getItem(POSTER_STORE)||'';return `<section class="posterUpload"><h3>フライヤーを1枚入れてみる</h3><p>画像を入れると、下のZOOM / SPLIT / STACKがあなたのフライヤーで動きます。画像はこの端末の中だけで使います。</p><div class="uploadRow"><label class="uploadLabel">画像を選ぶ<input id="posterFile" type="file" accept="image/*"></label><span class="posterStatus" id="posterStatus">${img?'フライヤー設定済み':'未設定でも試せます'}</span></div><img class="posterThumb ${img?'show':''}" id="posterThumb" ${img?`src="${img}"`:''} alt="フライヤープレビュー"></section>`}
function setupPosterUpload(){const input=document.getElementById('posterFile');if(!input)return;input.addEventListener('change',async()=>{const file=input.files&&input.files[0];if(!file)return;document.getElementById('posterStatus').textContent='画像を準備しています…';try{const data=await resizeImage(file,1400,1800,.82);localStorage.setItem(POSTER_STORE,data);const thumb=document.getElementById('posterThumb');thumb.src=data;thumb.className='posterThumb show';document.getElementById('posterStatus').textContent='設定できました。下の3演出に反映しました。';applyPosterThumbs()}catch(e){document.getElementById('posterStatus').textContent='画像を読み込めませんでした。別の画像で試してください。'}})}
function resizeImage(file,maxW,maxH,quality){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{let w=img.width,h=img.height;const scale=Math.min(1,maxW/w,maxH/h);w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',quality))};img.src=reader.result};reader.readAsDataURL(file)})}
function applyPosterThumbs(){const img=localStorage.getItem(POSTER_STORE)||'';if(!img)return;document.querySelectorAll('.miniPoster').forEach(el=>{el.style.backgroundImage=`url("${img}")`;el.style.backgroundColor='#111'})}
function form(cat,st){const c=CATS[cat],p=findPattern(cat,st);if(!c||!p)return home();const old=readDraft();document.title=`${p.name}｜公演サイトメーカー`;app.innerHTML=makerHeader()+`<main class="wrap formArea"><div class="kicker">${c.en} / ${p.name}</div><h1>公演情報を入れる</h1><p class="sub">ここで作るのは“公演の入口”。完成ページから公式サイトとチケットページへつなぎます。</p>${cat==='poster'?`<div class="posterUpload"><h3>フライヤー</h3><p>${localStorage.getItem(POSTER_STORE)?'選んだフライヤーを完成ページに使います。変更したい場合は演出選択画面へ戻ってください。':'フライヤー未設定です。演出は仮のビジュアルでも確認できます。'}</p></div>`:''}<form class="form" id="makerForm"><div class="field"><label>公演タイトル</label><input name="title" required placeholder="例：夜明けを待つ部屋"></div><div class="field"><label>団体名</label><input name="org" placeholder="例：劇団サンプル"></div><div class="field"><label>公演日程</label><textarea name="date" placeholder="例：2026/1/1 19:00&#10;2026/1/2 13:00"></textarea><small>複数回ある場合は改行してください。</small></div><div class="field"><label>会場</label><textarea name="venue" placeholder="例：東京 ○○スタジオ"></textarea></div><div class="field"><label>料金（任意）</label><input name="price" placeholder="例：前売 3,000円 / 当日 3,500円"></div><div class="field"><label>公式サイト・公演詳細URL</label><input name="official" inputmode="url" placeholder="https://..."></div><div class="field full"><label>チケット予約URL</label><input name="ticket" inputmode="url" placeholder="https://..."></div><div class="field full"><label>あらすじ（任意）</label><textarea name="story" placeholder="作品の紹介文。空欄でも完成ページは成立します。"></textarea></div><div class="field full"><label>出演者（任意）</label><textarea name="cast" placeholder="一人ずつ改行"></textarea></div><button class="goPreview" type="submit">別ページで完成サイトを見る →</button></form><div class="note">入力した内容はこの端末のブラウザ内に一時保存します。この試作版では公開されません。</div><a class="backLink" href="?category=${cat}">← 演出を選び直す</a></main>`;const f=document.getElementById('makerForm');if(old&&old.category===cat&&old.style===st){Object.keys(old.data||{}).forEach(k=>{if(f.elements[k])f.elements[k].value=old.data[k]||''})}f.addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(f));localStorage.setItem(STORE,JSON.stringify({category:cat,style:st,data}));location.href=`?preview=${st}&category=${cat}`})}
function readDraft(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){return null}}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function validUrl(s){return /^https?:\/\//i.test((s||'').trim())}
function niceDates(s=''){return s.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/(\d{4})\/(\d{1,2})\/(\d{1,2})/g,'$1年$2月$3日'))}
function previewPage(cat,st){const c=CATS[cat],p=findPattern(cat,st),draft=readDraft();if(!c||!p||!draft||draft.category!==cat||draft.style!==st){app.innerHTML=makerHeader()+`<main class="wrap formArea"><h1>プレビュー情報がありません</h1><p class="sub">先に公演情報を入力してください。</p><a class="backLink" href="?category=${cat||''}">入力画面へ戻る</a></main>`;return}const d=draft.data||{};document.title=(d.title||'公演プレビュー');document.body.className='previewBody';const dates=niceDates(d.date);const cast=(d.cast||'').split('\n').map(x=>x.trim()).filter(Boolean);const official=validUrl(d.official)?d.official:'';const ticket=validUrl(d.ticket)?d.ticket:'';const heroExtra=st==='scramble'?`<div class="scrambleDisplay" id="scrambleText"></div>`:`<div class="siteTitle">${esc(d.title||'公演タイトル')}</div>`;const poster=cat==='poster'?(localStorage.getItem(POSTER_STORE)||''):'';const posterStyle=poster?`style="--poster-bg:url('${poster}')"`:'';app.innerHTML=`<div class="site ${cat}" ${posterStyle}><nav class="siteNav"><div>${esc(d.org||'PERFORMANCE')}</div><div class="navlinks"><a href="#story">STORY</a><a href="#cast">CAST</a><a href="#schedule">SCHEDULE</a><a href="#access">ACCESS</a></div></nav><section class="siteHero ${st}"><div class="heroInner"><div class="siteOrg">${esc(d.org||'')}</div>${heroExtra}<div class="siteMeta">${esc(d.venue||'')} ${dates[0]?' / '+esc(dates[0]):''}</div></div><div class="scrollCue">SCROLL</div></section>${d.story?`<section class="contentSec" id="story"><div class="secInner"><div class="secLabel">STORY</div><h2>あらすじ</h2><div class="storyText">${esc(d.story)}</div></div></section>`:''}${cast.length?`<section class="contentSec" id="cast"><div class="secInner"><div class="secLabel">CAST</div><h2>出演</h2><div class="castGrid">${cast.map(x=>`<div class="castName">${esc(x)}</div>`).join('')}</div></div></section>`:''}<section class="contentSec" id="schedule"><div class="secInner"><div class="secLabel">SCHEDULE</div><h2>公演日程</h2><div class="scheduleList">${dates.length?dates.map(x=>`<div class="scheduleItem">${esc(x)}</div>`).join(''):'<div class="scheduleItem">日程未入力</div>'}</div>${d.price?`<div class="scheduleItem"><b>料金</b><br>${esc(d.price)}</div>`:''}</div></section><section class="contentSec" id="access"><div class="secInner"><div class="secLabel">ACCESS</div><h2>会場</h2><div class="storyText">${esc(d.venue||'会場未入力')}</div><div class="linkRow">${official?`<a class="bigLink" href="${esc(official)}" target="_blank" rel="noopener">公演詳細を見る →</a>`:'<span class="bigLink disabled">公演詳細URL 未設定</span>'}${ticket?`<a class="bigLink primaryLink" href="${esc(ticket)}" target="_blank" rel="noopener"><span>チケットを予約する →</span></a>`:'<span class="bigLink disabled">予約ページ準備中</span>'}</div></div></section></div><div class="previewTools"><a class="editBtn" href="?category=${cat}&style=${st}">← 入力を直す</a><button class="replayBtn" id="replayOpening" type="button">↻ OPENING</button></div>`;if(st==='scramble')runScramble(d.title||'STAGE');playOpening(cat,st,d.title||'STAGE',poster);document.getElementById('replayOpening').addEventListener('click',()=>playOpening(cat,st,d.title||'STAGE',poster))}
function playOpening(cat,st,title,poster){document.querySelectorAll('.openingLayer').forEach(x=>x.remove());const layer=document.createElement('div');layer.className=`openingLayer ${st} out`;if(cat==='poster'){layer.innerHTML=`<div class="openingPoster" ${poster?`style="background-image:url('${poster}')"`:''}></div>`}else if(st==='scramble'){layer.innerHTML=`<div class="openingTitle" id="openingScramble"></div>`}else{layer.innerHTML=`<div class="openingTitle">${esc(title)}</div>`}document.body.appendChild(layer);if(st==='scramble')runOpeningScramble(title);setTimeout(()=>{if(layer.parentNode)layer.remove()},3300)}
function runScramble(finalText){const el=document.getElementById('scrambleText');if(!el)return;scrambleInto(el,finalText,34,55)}
function runOpeningScramble(finalText){const el=document.getElementById('openingScramble');if(!el)return;scrambleInto(el,finalText,28,48)}
function scrambleInto(el,finalText,max,delay){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#?%';let frame=0;const timer=setInterval(()=>{frame++;const lock=Math.floor((frame/max)*finalText.length);el.textContent=[...finalText].map((ch,i)=>ch===' '?' ':i<lock?ch:chars[Math.floor(Math.random()*chars.length)]).join('');if(frame>=max){el.textContent=finalText;clearInterval(timer)}},delay)}
if(preview)previewPage(category,preview);else if(diagnose)diagnosis();else if(category&&style)form(category,style);else if(category)choose(category);else home();
</script>
</body>
