<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>公演サイトメーカー</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#09090b;color:#f7f5ef;line-height:1.75}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}.wrap{width:min(1080px,calc(100% - 36px));margin:auto}
.top{position:fixed;z-index:80;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#09090bdd;backdrop-filter:blur(14px);border-bottom:1px solid #ffffff12}.top a{font-size:12px}.brand{font-weight:900}.badge{font-size:10px;padding:7px 10px;border:1px solid #ffffff24;border-radius:999px}.intro{padding:115px 0 40px}.intro small,.eyebrow{font-size:11px;letter-spacing:.17em;opacity:.65}.intro h1{margin:12px 0 18px;font-size:clamp(46px,12vw,105px);line-height:.9;letter-spacing:-.07em}.intro p{max-width:720px;color:#aaa;font-size:14px}.cards{display:grid;gap:16px;padding-bottom:80px}.card{position:relative;min-height:440px;border:1px solid #ffffff18;border-radius:28px;overflow:hidden;padding:25px;display:flex;align-items:flex-end}.cardIn{position:relative;z-index:4;max-width:650px}.card .n{font-size:10px;letter-spacing:.16em;opacity:.6}.card h2{margin:7px 0 12px;font-size:clamp(50px,13vw,105px);line-height:.82;letter-spacing:-.07em}.card h3{font-size:17px;margin:0 0 8px}.card p{font-size:13px;margin:0 0 16px;color:#d0cfd5}.pill{display:inline-block;padding:10px 13px;border-radius:999px;border:1px solid #ffffff30;background:#1119;font-size:11px;backdrop-filter:blur(8px)}
.reveal{background:#030304}.reveal:before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;right:8%;top:14%;background:radial-gradient(circle,#fff9 0,#fff3 26%,transparent 68%);filter:blur(5px);animation:beam 5s ease-in-out infinite alternate}@keyframes beam{to{transform:translate(-38vw,25vh) scale(.75)}}
.flow{background:#07102f}.flow:before,.flow:after{content:"";position:absolute;width:125vw;height:58vh;left:-15vw;border-radius:49% 51% 56% 44%/58% 46% 54% 42%;mix-blend-mode:screen}.flow:before{top:-18vh;background:linear-gradient(90deg,#6253ff,#00d7ff);animation:f1 6s ease-in-out infinite alternate}.flow:after{bottom:-24vh;background:linear-gradient(90deg,#ff4f99,#784cff);animation:f2 7s ease-in-out infinite alternate}@keyframes f1{to{transform:translate(14vw,28vh) rotate(15deg)}}@keyframes f2{to{transform:translate(-14vw,-24vh) rotate(-13deg)}}
.type{background:#eeeade;color:#111}.type:before{content:"ことばが\A舞台になる。";white-space:pre;position:absolute;left:4%;top:8%;font-family:Georgia,"Yu Mincho",serif;font-size:clamp(68px,20vw,205px);line-height:.83;letter-spacing:-.09em;color:#1112}.type p{color:#333}.type .pill{color:#111;border-color:#1112;background:#fff8}.poster{background:#111116}.poster:before{content:"";position:absolute;width:min(70vw,570px);aspect-ratio:3/4;right:-4%;top:2%;background:linear-gradient(145deg,#ffd22f 0 43%,#ff4d6d 43% 70%,#f5efe0 70%);transform:rotate(8deg);box-shadow:0 30px 90px #000a}.poster:after{content:"PLAY\A2026";white-space:pre;position:absolute;right:4%;top:10%;font:900 clamp(46px,12vw,110px)/.8 -apple-system,sans-serif;letter-spacing:-.08em;color:#111}.quiet{background:#f0ede5;color:#111}.quiet:before{content:"";position:absolute;right:10%;top:15%;width:34%;height:38%;background:linear-gradient(145deg,#d6d2c7,#b8b4aa)}.quiet:after{content:"";position:absolute;right:6%;top:11%;height:65%;width:1px;background:#1113}.quiet p{color:#333}.quiet .pill{color:#111;border-color:#1112;background:#fff8}
.hero{min-height:82svh;padding:105px 20px 55px;position:relative;overflow:hidden;display:flex;align-items:flex-end}.heroIn{position:relative;z-index:4;width:min(1080px,100%);margin:auto}.hero h1{margin:10px 0 14px;font-size:clamp(55px,15vw,130px);line-height:.84;letter-spacing:-.075em}.hero h2{margin:0 0 9px;font-size:19px}.hero p{max-width:680px;font-size:14px;color:#c9c8cd;margin:0}.hero.type p,.hero.quiet p{color:#333}.back{display:inline-flex;margin-top:23px;font-size:11px;padding:9px 12px;border:1px solid currentColor;border-radius:999px;opacity:.8}.section{padding:52px 0 82px}.section h3{font-size:31px;line-height:1.2;letter-spacing:-.04em;margin:0 0 8px}.lead{font-size:13px;color:#aaa;margin:0 0 20px}.guide{padding:18px;border:1px solid #ffffff17;border-radius:20px;background:#151518;margin-bottom:22px}.guide strong{font-size:14px}.guide p{margin:7px 0 0;font-size:12px;color:#aaa}.ex{display:inline-block;padding:1px 7px;background:#ffffff0c;border-radius:7px;color:#eee}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.full{grid-column:1/-1}.field label{font-size:12px;font-weight:800}.field small{font-size:11px;color:#85858c}.field input,.field textarea{width:100%;border:1px solid #ffffff1a;background:#17171b;color:#fff;border-radius:14px;padding:14px 15px;outline:none}.field textarea{min-height:115px;resize:vertical}.make{grid-column:1/-1;border:0;border-radius:16px;padding:17px 18px;background:#f4f2ed;color:#111;font-weight:900;margin-top:8px}.foot{padding:35px 20px 60px;text-align:center;color:#666;font-size:11px;border-top:1px solid #ffffff10}
/* 完成サイト */
.site{min-height:100svh;background:#08080a;color:#f6f4ef}.site.type,.site.quiet{color:#171717}.previewBar{position:fixed;z-index:110;top:calc(10px + env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.previewBar a{pointer-events:auto;background:#0d0d0dbf;color:#fff;border:1px solid #ffffff26;border-radius:999px;padding:9px 12px;font-size:11px;backdrop-filter:blur(12px)}.siteNav{position:fixed;z-index:70;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:18px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:#08080ad9;backdrop-filter:blur(14px);border-top:1px solid #ffffff16;font-size:10px;letter-spacing:.08em}.site.type .siteNav,.site.quiet .siteNav{background:#f4f0e4e6;border-color:#1112}.siteHero{position:relative;min-height:100svh;overflow:hidden;display:flex;align-items:flex-end;padding:110px 22px 90px}.siteHeroIn{position:relative;z-index:5;width:min(1000px,100%);margin:auto}.siteOrg{font-size:11px;letter-spacing:.16em;opacity:.65}.siteTitle{font-size:clamp(58px,16vw,150px);line-height:.82;letter-spacing:-.075em;margin:10px 0 18px;max-width:1000px}.scrollHint{margin-top:48px;font-size:10px;letter-spacing:.18em;opacity:.55}.siteSection{padding:90px 22px;border-top:1px solid #ffffff14}.site.type .siteSection,.site.quiet .siteSection{border-color:#1112}.siteInner{width:min(900px,100%);margin:auto}.sectionNo{font-size:10px;letter-spacing:.18em;opacity:.55}.siteSection h2{font-size:clamp(42px,10vw,82px);letter-spacing:-.055em;line-height:.95;margin:10px 0 28px}.storyText{white-space:pre-line;font-size:15px;line-height:2.1;max-width:720px}.castGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.castName{border:1px solid currentColor;border-radius:16px;padding:18px 14px;font-size:14px;opacity:.9}.scheduleBox{display:grid;gap:12px}.scheduleLine{display:flex;justify-content:space-between;gap:20px;padding:16px 0;border-bottom:1px solid currentColor;font-size:14px}.metaGrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.metaCard{border:1px solid currentColor;border-radius:20px;padding:20px}.metaCard b{display:block;font-size:10px;letter-spacing:.1em;margin-bottom:7px}.ticketArea{text-align:center;padding:105px 22px 130px}.ticketArea h2{font-size:clamp(52px,14vw,120px);letter-spacing:-.06em;line-height:.9;margin:0 0 25px}.ticketBtn{display:inline-flex;align-items:center;justify-content:center;min-width:210px;padding:17px 24px;border-radius:999px;background:#f4f1e9;color:#111;font-weight:900;border:0}.site.type .ticketBtn,.site.quiet .ticketBtn{background:#111;color:#fff}.ticketBtn.disabled{opacity:.45;cursor:default}.ticketNote{font-size:11px;opacity:.55;margin-top:12px}.opening{position:fixed;z-index:200;inset:0;display:grid;place-items:center;pointer-events:none;animation:openingOut .9s ease 1.55s forwards}.openingWord{padding:22px;text-align:center;font-size:clamp(44px,14vw,120px);font-weight:900;letter-spacing:-.07em;animation:openingIn .8s ease both}@keyframes openingIn{from{opacity:0;transform:scale(.92);filter:blur(12px)}to{opacity:1;transform:none;filter:none}}@keyframes openingOut{to{opacity:0;visibility:hidden}}
.site.reveal{background:#030304}.site.reveal .opening{background:#030304}.site.reveal .siteHero:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;right:5%;top:10%;background:radial-gradient(circle,#fff8 0,#fff2 28%,transparent 68%);filter:blur(7px);animation:beam 6s ease-in-out infinite alternate}.site.flow{background:#07102f}.site.flow .opening{background:#07102f}.site.flow .siteHero:before,.site.flow .siteHero:after{content:"";position:absolute;width:130vw;height:60vh;left:-15vw;border-radius:50%;mix-blend-mode:screen}.site.flow .siteHero:before{top:-20vh;background:linear-gradient(90deg,#6554ff,#00d7ff);animation:f1 6s ease-in-out infinite alternate}.site.flow .siteHero:after{bottom:-24vh;background:linear-gradient(90deg,#ff4d95,#754cff);animation:f2 7s ease-in-out infinite alternate}.site.type{background:#eeeade}.site.type .opening{background:#eeeade}.site.type .siteHero:before{content:"ことばが\A舞台になる。";white-space:pre;position:absolute;left:-3%;top:4%;font-family:Georgia,"Yu Mincho",serif;font-size:clamp(100px,29vw,330px);line-height:.72;color:#11110;letter-spacing:-.09em}.site.poster{background:#111116}.site.poster .opening{background:linear-gradient(145deg,#ffd22f 0 43%,#ff4d6d 43% 70%,#f5efe0 70%);color:#111}.site.poster .siteHero:before{content:"";position:absolute;width:min(72vw,600px);aspect-ratio:3/4;right:-8%;top:4%;background:linear-gradient(145deg,#ffd22f 0 43%,#ff4d6d 43% 70%,#f5efe0 70%);transform:rotate(8deg);box-shadow:0 30px 100px #000a}.site.quiet{background:#f0ede5}.site.quiet .opening{background:#f0ede5}.site.quiet .siteHero:before{content:"";position:absolute;right:9%;top:14%;width:34%;height:36%;background:linear-gradient(145deg,#d6d2c7,#b8b4aa)}.site.quiet .siteHero:after{content:"";position:absolute;right:6%;top:10%;width:1px;height:65%;background:#1113}
@media(max-width:640px){.form{grid-template-columns:1fr}.full,.make{grid-column:auto}.card{min-height:470px}.hero{min-height:84svh}.metaGrid{grid-template-columns:1fr}.siteNav{gap:11px;overflow-x:auto;justify-content:flex-start}.siteSection{padding:76px 20px}.siteHero{padding-left:20px;padding-right:20px}.scheduleLine{display:block}.scheduleLine span{display:block;margin-top:4px;opacity:.7}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const T={
reveal:{name:'REVEAL',jp:'隠れたものが現れる',desc:'暗い画面の中から光が当たった場所だけ言葉やビジュアルが現れます。ミステリー、幻想、ホラーなど、最初から世界観に引き込みたい公演向け。'},
flow:{name:'FLOW',jp:'画面そのものが流れて変わる',desc:'色や形が画面を横切り、場面転換のように情報が切り替わります。ダンス、音楽劇、抽象的な作品など、動きや勢いを見せたい公演向け。'},
type:{name:'TYPE',jp:'言葉そのものを舞台にする',desc:'大きな文字が現れたり、重なったり、離れたりします。写真が少なくても、タイトルや台詞を主役にして強い印象を作れます。'},
poster:{name:'POSTER',jp:'フライヤーをサイトの主役にする',desc:'公演フライヤーの色や構成をサイトの中心にして見せます。宣伝ビジュアルを最大限活かしたい公演向け。'},
quiet:{name:'QUIET',jp:'静かに、上品に見せる',desc:'余白、大きな文字、一枚の写真を中心に、動きを抑えて見せます。会話劇や文芸作品など、静かな空気を活かしたい公演向け。'}
};
const app=document.getElementById('app'),q=new URLSearchParams(location.search),view=q.get('view'),preview=q.get('preview'),KEY='koensaito-preview-v2';
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmtDate(s=''){return String(s).split('\n').map(x=>x.trim().replace(/(\d{4})\/(\d{1,2})\/(\d{1,2})/g,'$1年$2月$3日')).filter(Boolean).join('\n')}
function saved(){try{return JSON.parse(sessionStorage.getItem(KEY)||'{}')}catch(e){return {}}}
function home(){app.innerHTML=`<header class="top"><a class="brand" href="?">公演サイトメーカー</a><span class="badge">試作版</span></header><main class="wrap"><section class="intro"><small>舞台・公演向け</small><h1>作品に合う<br>見せ方を選ぶ。</h1><p>公演情報を入れるだけで、作品の空気に合わせたサイトを試せます。気になる見せ方を選んでください。</p></section><section class="cards">${Object.entries(T).map(([k,t],i)=>`<a class="card ${k}" href="?view=${k}"><div class="cardIn"><div class="n">0${i+1}</div><h2>${t.name}</h2><h3>${t.jp}</h3><p>${t.desc}</p><span class="pill">この見せ方を開く →</span></div></a>`).join('')}</section></main><footer class="foot">ここで入力しただけでは公開されません。</footer>`}
function maker(k){const t=T[k],s=saved(),d=s.template===k?s:{};app.innerHTML=`<header class="top"><a class="brand" href="?">公演サイトメーカー</a><span class="badge">試作版</span></header><main><section class="hero ${k}"><div class="heroIn"><div class="eyebrow">${t.name}</div><h1>${t.name}</h1><h2>${t.jp}</h2><p>${t.desc}</p><a class="back" href="?">← 5つの見せ方へ戻る</a></div></section><section class="section"><div class="wrap"><h3>公演情報を入れる</h3><p class="lead">入力後は、設定画面ではなく「完成した公演サイト」だけの別URLへ移動します。</p><div class="guide"><strong>書き方は自由です。</strong><p>日程は <span class="ex">2026/1/1 19:00</span> のような書き方でOK。複数公演は改行してください。</p><p>出演者も一人ずつ改行すると、完成サイトで一人ずつ表示します。</p></div><form class="form" id="f"><div class="field"><label>公演タイトル</label><input name="title" required value="${esc(d.title||'')}" placeholder="例：夜明けを待つ部屋"></div><div class="field"><label>団体名</label><input name="org" value="${esc(d.org||'')}" placeholder="例：劇団サンプル"></div><div class="field"><label>公演日時</label><textarea name="date" placeholder="例：2026/1/1 19:00&#10;2026/1/2 13:00">${esc(d.date||'')}</textarea><small>西暦/月/日 時刻くらいでOK。</small></div><div class="field"><label>会場</label><textarea name="venue" placeholder="例：東京 ○○スタジオ">${esc(d.venue||'')}</textarea></div><div class="field"><label>料金</label><input name="price" value="${esc(d.price||'')}" placeholder="例：前売 3,000円 / 当日 3,500円"></div><div class="field"><label>予約ページ</label><input name="url" value="${esc(d.url||'')}" placeholder="例：https://..."><small>未入力なら完成サイトでは「予約ページ準備中」と表示します。</small></div><div class="field full"><label>出演者</label><textarea name="cast" placeholder="例：山田花子&#10;佐藤太郎&#10;鈴木一郎">${esc(d.cast||'')}</textarea></div><div class="field full"><label>あらすじ</label><textarea name="story" placeholder="例：ある冬の夜、ひとりの男が誰もいない駅に降り立つ。そこには、忘れたはずの記憶が待っていた。">${esc(d.story||'')}</textarea></div><button class="make" type="submit">別ページで完成サイトを見る</button></form></div></section></main>`;document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));data.template=k;sessionStorage.setItem(KEY,JSON.stringify(data));location.href=`?preview=${k}`})}
function fullSite(k){const d=saved();if(!d.title||d.template!==k){location.href=`?view=${k}`;return}const cast=String(d.cast||'').split('\n').map(x=>x.trim()).filter(Boolean),dates=fmtDate(d.date||'').split('\n').filter(Boolean),hasUrl=/^https?:\/\//i.test(d.url||'');const ticket=hasUrl?`<a class="ticketBtn" href="${esc(d.url)}" target="_blank" rel="noopener">TICKET / 予約する</a><div class="ticketNote">予約ページが新しい画面で開きます。</div>`:`<span class="ticketBtn disabled">予約ページ準備中</span><div class="ticketNote">設定画面で予約URLを入力すると、ここから予約ページへ移動できます。</div>`;app.innerHTML=`<div class="site ${k}"><div class="opening"><div class="openingWord">${esc(d.title)}</div></div><div class="previewBar"><a href="?view=${k}">← 入力を直す</a><a href="?">テンプレ一覧</a></div><nav class="siteNav"><a href="#story">STORY</a><a href="#cast">CAST</a><a href="#schedule">SCHEDULE</a><a href="#access">ACCESS</a><a href="#ticket">TICKET</a></nav><section class="siteHero"><div class="siteHeroIn"><div class="siteOrg">${esc(d.org||'')}</div><h1 class="siteTitle">${esc(d.title)}</h1><div class="scrollHint">SCROLL TO ENTER ↓</div></div></section><section class="siteSection" id="story"><div class="siteInner"><div class="sectionNo">01 / STORY</div><h2>STORY</h2><div class="storyText">${esc(d.story||'あらすじはまだ入力されていません。')}</div></div></section><section class="siteSection" id="cast"><div class="siteInner"><div class="sectionNo">02 / CAST</div><h2>CAST</h2><div class="castGrid">${cast.length?cast.map(n=>`<div class="castName">${esc(n)}</div>`).join(''):'<div class="castName">出演者はまだ入力されていません。</div>'}</div></div></section><section class="siteSection" id="schedule"><div class="siteInner"><div class="sectionNo">03 / SCHEDULE</div><h2>SCHEDULE</h2><div class="scheduleBox">${dates.length?dates.map((x,i)=>`<div class="scheduleLine"><b>STAGE ${String(i+1).padStart(2,'0')}</b><span>${esc(x)}</span></div>`).join(''):'<div class="scheduleLine"><b>DATE</b><span>日程はまだ入力されていません。</span></div>'}</div></div></section><section class="siteSection" id="access"><div class="siteInner"><div class="sectionNo">04 / ACCESS</div><h2>ACCESS</h2><div class="metaGrid"><div class="metaCard"><b>VENUE</b><div>${esc(d.venue||'会場はまだ入力されていません。')}</div></div><div class="metaCard"><b>PRICE</b><div>${esc(d.price||'料金はまだ入力されていません。')}</div></div></div></div></section><section class="ticketArea" id="ticket"><div class="sectionNo">05 / TICKET</div><h2>TICKET</h2>${ticket}</section></div>`}
if(preview&&T[preview])fullSite(preview);else if(view&&T[view])maker(view);else home();
</script>
</body>
</html>
