<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080706">
<title>失くしたあなたと冷蔵庫で夢を見る｜プレイカンパニー空集合</title>
<style>
:root {
  --bg:#080706;
  --ink:#f1ede5;
  --muted:rgba(241,237,229,.62);
  --line:rgba(255,255,255,.18);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink)}
body{
  position:fixed;inset:0;
  font-family:"Yu Mincho","Hiragino Mincho ProN","Hiragino Mincho Pro",serif;
  overscroll-behavior:none;
}
a,button{font:inherit;color:inherit}
a{text-decoration:none}

.app{
  position:fixed;inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 35%, #241d1a 0, #100d0c 43%, #050505 100%);
}
.visual-area{
  position:absolute;
  inset:0 0 118px 0;
  display:grid;
  place-items:center;
  padding:
    calc(12px + env(safe-area-inset-top))
    14px
    8px;
