const params=new URLSearchParams(location.search);
const app=document.getElementById('app');
const category=params.get('category');
const style=params.get('style');
const preview=params.get('preview');
const diagnose=params.get('diagnose');
const STORE='koensaito_draft_v15';
const POSTER_STORE='koensaito_poster_image_v1';
const VISUAL_STORE='koensaito_main_visual_v2';
const VISUAL_ANALYSIS='koensaito_visual_analysis_v1';
function makerHeader(){return `<header class="makerHead"><a href="./">公演サイトメーカー</a><span class="badge">試作版</span></header>`}
function allPatterns(){return Object.entries(PATTERNS).flatMap(([cat,list])=>list.map(p=>({...p,cat})))}
function findPattern(cat,id){return (PATTERNS[cat]||[]).find(p=>p.id===id)}
function demoHtml(cat,p){return `<div class="demo ${p.demo}">${cat==='poster'?'<span class="miniPoster"></span>':'<i class="miniVisual"></i><span>STAGE</span>'}</div>`}
function patternCard(cat,p,i,rank=''){return `<article class="pattern"><div><div class="num">${rank||`0${i+1}`}</div><h3>${p.name}</h3><p>${p.desc}</p><div class="fit"><b>こんな作品に</b>${p.fit}</div>${demoHtml(cat,p)}</div><a class="patternBtn" href="?category=${cat}&style=${p.id}">この演出を使う</a></article>`}
function home(){document.title='公演サイトメーカー';app.innerHTML=makerHeader()+`<main class="wrap"><section class="intro"><div class="kicker">舞台・公演向け</div><h1>公演の、<br>入口をつくる。</h1><p>フライヤーや公演情報を入れるだけ。SNSから来た人を数秒で作品世界へ連れていき、公式サイトや予約ページへつなぐティザーページを作ります。</p><div class="homeActions"><a class="homeBtn primary" href="?diagnose=1">作品の雰囲気からおすすめを見る</a><button class="homeBtn" id="randomBtn" type="button">おまかせで選ぶ 🎲</button></div><div class="randomBox" id="randomBox"></div></section><section class="categories">${Object.entries(CATS).map(([k,c],i)=>`<a class="cat ${c.bg}" href="?category=${k}"><div class="catIn"><div class="kicker">0${i+1} / ${c.en}</div><h2>${c.en}</h2><h3>${c.name}</h3><p>${c.desc}</p><span class="pill">${PATTERNS[k].length}つの演出を見る →</span></div></a>`).join('')}</section><section class="productModes"><div class="kicker">HOW TO USE</div><h2>入口にも、<br>公式サイトにも。</h2><div class="modeGrid"><div class="productCard"><div class="plan">TEASER / FREE想定</div><h3>公演の入口として</h3><p>世界観を見せて、既存の公式サイトや予約ページへ送る。まず広く使ってもらう基本形。</p></div><div class="productCard"><div class="plan">FULL SITE / 公開時に課金</div><h3>完成まで無料で試せる</h3><p>STORY・CAST・STAFF・SCHEDULE・ACCESSまで全部作って、完成画面を確認。気に入った場合だけ公開時に課金する想定。</p></div><div class="productCard future"><div class="plan">AI MOTION / 将来</div><h3>フライヤーから専用演出</h3><p>文字・人物・背景を認識して、その公演にしか見えない動きを提案する上位機能。</p></div></div></section></main>`;document.getElementById('randomBtn').addEventListener('click',rollRandom);applyVisualThumbs()}
function rollRandom(){const all=allPatterns();const pick=all[Math.floor(Math.random()*all.length)];const box=document.getElementById('randomBox');box.className='randomBox show';box.innerHTML=`<div class="randomTop"><div><div class="kicker">TODAY'S PICK / ${CATS[pick.cat].en}</div><h3>${pick.name}</h3><p>${pick.desc}</p><div class="fit"><b>こんな作品に</b>${pick.fit}</div></div></div>${demoHtml(pick.cat,pick)}<div class="randomActions"><button class="miniBtn" id="reroll" type="button">もう一回 🎲</button><a class="miniBtn primary" href="?category=${pick.cat}&style=${pick.id}">これで作ってみる →</a></div>`;applyVisualThumbs();document.getElementById('reroll').addEventListener('click',rollRandom);box.scrollIntoView({behavior:'smooth',block:'nearest'})}
function diagnosis(){document.title='作品に合う演出診断｜公演サイトメーカー';app.innerHTML=makerHeader()+`<main class="wrap"><section class="diagHero"><div class="kicker">3 QUESTIONS</div><h1>作品の空気から、<br>演出を選ぶ。</h1><p>3つだけ答えると、${allPatterns().length}種類の中から相性がよさそうな演出を3つ提案します。正解を決める診断ではなく、選ぶきっかけとして使ってください。</p><a class="backLink" href="./">← トップへ戻る</a></section><form class="quiz" id="quiz"><section class="question"><h3>01. 作品の空気はどちらに近い？</h3><div class="choices"><label class="choice"><input type="radio" name="mood" value="dark" required><span>暗い・不思議・シリアス</span></label><label class="choice"><input type="radio" name="mood" value="bright"><span>明るい・楽しい・開放的</span></label></div></section><section class="question"><h3>02. 動きの印象は？</h3><div class="choices"><label class="choice"><input type="radio" name="energy" value="quiet" required><span>静か・じっくり</span></label><label class="choice"><input type="radio" name="energy" value="powerful"><span>強い・勢いがある</span></label></div></section><section class="question"><h3>03. 何を一番印象に残したい？</h3><div class="choices"><label class="choice"><input type="radio" name="focus" value="visual" required><span>写真・フライヤー・色</span></label><label class="choice"><input type="radio" name="focus" value="words"><span>タイトル・言葉</span></label></div></section><button class="diagBtn" type="submit">おすすめ3つを見る →</button></form><section class="results" id="results"></section></main>`;document.getElementById('quiz').addEventListener('submit',e=>{e.preventDefault();showDiagnosis(Object.fromEntries(new FormData(e.currentTarget)))})}
function showDiagnosis(ans){const scored=allPatterns().map((p,idx)=>{let score=0;score+=p.traits.mood===ans.mood?4:0;score+=p.traits.energy===ans.energy?3:0;score+=p.traits.focus===ans.focus?4:0;if(p.cat==='poster'&&ans.focus==='visual')score+=1;if(p.cat==='type'&&ans.focus==='words')score+=1;return {...p,score,idx}}).sort((a,b)=>b.score-a.score||a.idx-b.idx).slice(0,3);const reasons={dark:'作品の暗さ・余韻',bright:'明るさ・開放感',quiet:'静かなテンポ',powerful:'強い動き',visual:'ビジュアル重視',words:'言葉重視'};const r=document.getElementById('results');r.className='results show';r.innerHTML=`<div class="kicker">RECOMMENDATION</div><h2 style="font-size:34px;letter-spacing:-.04em;margin:8px 0 18px">この3つから見るのがおすすめ</h2><div class="resultGrid">${scored.map((p,i)=>`<article class="resultCard"><div class="rank">0${i+1} / ${CATS[p.cat].en}</div><h3>${p.name}</h3><p>${p.desc}</p><div class="reason">${reasons[ans.mood]}・${reasons[ans.energy]}・${reasons[ans.focus]}との相性から選びました。</div><div class="fit"><b>こんな作品に</b>${p.fit}</div>${demoHtml(p.cat,p)}<a class="patternBtn" href="?category=${p.cat}&style=${p.id}">これで作ってみる</a></article>`).join('')}</div>`;applyVisualThumbs();r.scrollIntoView({behavior:'smooth'})}
function getVisual(){return localStorage.getItem(VISUAL_STORE)||localStorage.getItem(POSTER_STORE)||''}
function choose(cat){const c=CATS[cat];if(!c)return home();document.title=`${c.name}｜公演サイトメーカー`;app.innerHTML=makerHeader()+`<main class="wrap"><section class="selectHero"><div class="kicker">${c.en}</div><h1>${c.name}</h1><p>${c.desc}</p><a class="backLink" href="./">← 5つのジャンルへ戻る</a></section>${visualUploader(cat,'choose')}<section class="patterns">${PATTERNS[cat].map((p,i)=>patternCard(cat,p,i)).join('')}</section></main>`;setupVisualUpload(cat);applyVisualThumbs();renderVisualInsights(cat)}
function visualUploader(cat,where='choose'){const img=getVisual();const title=cat==='poster'?'フライヤーを1枚入れてみる':'メインビジュアル / フライヤーを入れてみる';const copy=cat==='poster'?'画像を入れると、下の5演出が実際のフライヤーで動きます。':'画像を入れると、このジャンルの3演出と完成ページに反映します。画像なしでも試せます。';return `<section class="visualUpload"><h3>${title}</h3><p>${copy}</p><div class="uploadRow"><label class="uploadLabel">画像を選ぶ<input class="visualFile" type="file" accept="image/*"></label><button class="clearVisualBtn" type="button">画像を解除</button><span class="visualStatus">${img?'画像設定済み':'未設定でも試せます'}</span></div><img class="visualThumb ${img?'show':''}" ${img?`src="${img}"`:''} alt="ビジュアルプレビュー"><div class="visualInsight" data-cat="${cat}"></div></section>`}
function clearVisualSetting(){localStorage.removeItem(VISUAL_STORE);localStorage.removeItem(POSTER_STORE);localStorage.removeItem(VISUAL_ANALYSIS);document.querySelectorAll('.visualFile').forEach(el=>el.value='');document.querySelectorAll('.visualStatus').forEach(el=>el.textContent='未設定でも試せます');document.querySelectorAll('.visualThumb').forEach(el=>{el.classList.remove('show');el.removeAttribute('src')});applyVisualThumbs();renderVisualInsights();}
function setupVisualUpload(cat){document.querySelectorAll('.visualFile').forEach(input=>{input.addEventListener('change',async()=>{const file=input.files&&input.files[0];if(!file)return;const box=input.closest('.visualUpload');const status=box.querySelector('.visualStatus');status.textContent='画像を見ています…';try{const result=await resizeAndAnalyze(file,1000,1400,.74);localStorage.setItem(VISUAL_STORE,result.data);localStorage.setItem(POSTER_STORE,result.data);localStorage.setItem(VISUAL_ANALYSIS,JSON.stringify(result.analysis));const thumb=box.querySelector('.visualThumb');thumb.src=result.data;thumb.classList.add('show');status.textContent='設定できました。演出と完成ページに反映します。';applyVisualThumbs();renderVisualInsights(cat)}catch(e){status.textContent='画像を読み込めませんでした。別の画像で試してください。'}})});document.querySelectorAll('.clearVisualBtn').forEach(btn=>{btn.addEventListener('click',()=>clearVisualSetting())})}
function resizeAndAnalyze(file,maxW,maxH,quality){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{let w=img.width,h=img.height;const scale=Math.min(1,maxW/w,maxH/h);w=Math.max(1,Math.round(w*scale));h=Math.max(1,Math.round(h*scale));const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);const sample=document.createElement('canvas');sample.width=32;sample.height=32;const sx=sample.getContext('2d');sx.drawImage(canvas,0,0,32,32);const px=sx.getImageData(0,0,32,32).data;let lum=0,sat=0,n=0;for(let i=0;i<px.length;i+=16){const r=px[i],g=px[i+1],b=px[i+2];const mx=Math.max(r,g,b),mn=Math.min(r,g,b);lum+=(.2126*r+.7152*g+.0722*b);sat+=mx===0?0:(mx-mn)/mx*255;n++}const analysis={luma:Math.round(lum/n),sat:Math.round(sat/n),portrait:img.height>=img.width};resolve({data:canvas.toDataURL('image/jpeg',quality),analysis})};img.src=reader.result};reader.readAsDataURL(file)})}
function visualRecommendations(a){if(!a)return[];let ids=[];if(a.luma<105)ids.push(['reveal','spotlight'],['reveal','fadein']);else if(a.luma>175)ids.push(['quiet','slowfade'],['type','letters']);else ids.push(['quiet','focus'],['type','typewriter']);if(a.sat>75)ids.push(['flow','gradient'],['flow','wave'],['poster','posterStack']);else ids.push(['poster','posterFloat'],['quiet','parallax'],['reveal','tear'],['flow','ink']);const seen=new Set();return ids.filter(x=>{const k=x.join('/');if(seen.has(k))return false;seen.add(k);return true}).slice(0,3)}
function renderVisualInsights(cat){let a=null;try{a=JSON.parse(localStorage.getItem(VISUAL_ANALYSIS)||'null')}catch(e){};document.querySelectorAll('.visualInsight').forEach(el=>{if(!a||!getVisual()){el.classList.remove('show');return}const tone=a.luma<105?'暗め':a.luma>175?'明るめ':'中間の明るさ';const color=a.sat>75?'色が強め':a.sat<35?'落ち着いた色':'ほどよい色味';const shape=a.portrait?'縦長ビジュアル':'横長ビジュアル';const recs=visualRecommendations(a);el.classList.add('show');el.innerHTML=`<h4>画像から見た相性</h4><div class="insightPills"><span class="insightPill">${tone}</span><span class="insightPill">${color}</span><span class="insightPill">${shape}</span></div><p>今は端末内で明るさ・色味を簡易判定しています。将来はAIで文字・人物・背景を分けて専用演出を提案する想定です。</p><div class="recLinks">${recs.map(([c,id])=>{const p=findPattern(c,id);return `<a class="recLink" href="?category=${c}&style=${id}">${CATS[c].en} / ${p.name}</a>`}).join('')}</div>`})}
function applyVisualThumbs(){const img=getVisual();document.querySelectorAll('.miniVisual,.miniPoster').forEach(el=>{if(img){el.style.backgroundImage=`url("${img}")`;el.style.backgroundColor='#111'}else{el.style.backgroundImage='';el.style.backgroundColor=''}})}
function form(cat,st){const c=CATS[cat],p=findPattern(cat,st);if(!c||!p)return home();const old=readDraft();document.title=`${p.name}｜公演サイトメーカー`;app.innerHTML=makerHeader()+`<main class="wrap formArea"><div class="kicker">${c.en} / ${p.name}</div><h1>公演情報を入れる</h1><p class="sub">“入口だけ”にも、“このページだけで完成”にもできます。試作版では両方そのまま体験できます。</p>${visualUploader(cat,'form')}<form class="form" id="makerForm"><div class="field full modeBlock"><label>このページをどう使う？</label><div class="modeChoices"><label class="modeChoice"><input type="radio" name="mode" value="teaser"><span><em>TEASER / FREE想定</em><b>公演の入口として使う</b>世界観を見せたあと、公式サイトや予約ページへつなぎます。</span></label><label class="modeChoice"><input type="radio" name="mode" value="full" checked><span><em>FULL SITE / 公開時に課金</em><b>このページだけで完成させる</b>完成画面までは無料で確認。気に入った場合だけ公開する想定です。</span></label></div><small>料金機能はまだありません。完成画面までは無料で試し、公開するときだけ課金する設計を想定しています。</small></div><div class="field"><label>公演タイトル</label><input name="title" required placeholder="例：夜明けを待つ部屋"><small>ページ名や検索・公演情報に使います。フライヤーがある場合、メイン画面には重ねません。</small></div><div class="field"><label>団体名</label><input name="org" placeholder="例：劇団サンプル"></div><div class="field full"><small>フライヤーを入れた場合は、フライヤー自体をメインビジュアルとして見せます。サイト側のタイトル文字は上から重ねません。</small></div><div class="field"><label>公演日程</label><textarea name="date" placeholder="例：2026/1/1 19:00&#10;2026/1/2 13:00"></textarea><small>複数回ある場合は改行してください。</small></div><div class="field"><label>会場</label><textarea name="venue" placeholder="例：東京 ○○スタジオ"></textarea></div><div class="field"><label>料金（任意）</label><input name="price" placeholder="例：前売 3,000円 / 当日 3,500円"></div><div class="field"><label>公式サイト・公演詳細URL</label><input name="official" inputmode="url" placeholder="https://..."></div><div class="field full"><label>チケット予約URL</label><input name="ticket" inputmode="url" placeholder="https://..."></div><div class="fullFields" id="fullFields"><div class="field full"><label>あらすじ（任意）</label><textarea name="story" placeholder="作品の紹介文"></textarea></div><div class="field full"><label>出演者（任意）</label><textarea name="cast" placeholder="一人ずつ改行"></textarea></div><div class="field full"><label>スタッフ（任意）</label><textarea name="staff" placeholder="例：作・演出　山田太郎&#10;照明　佐藤花子"></textarea></div><div class="field full"><label>お問い合わせ・SNS URL（任意）</label><input name="contact" inputmode="url" placeholder="https://..."></div></div><button class="goPreview" type="submit">別ページで完成サイトを見る →</button></form><div class="note">入力内容と画像はこの端末のブラウザ内に一時保存します。この試作版では公開されません。</div><a class="backLink" href="?category=${cat}">← 演出を選び直す</a></main>`;const f=document.getElementById('makerForm');if(old&&old.category===cat&&old.style===st){Object.keys(old.data||{}).forEach(k=>{if(f.elements[k]){if(f.elements[k].type==='radio'){const radio=f.querySelector(`[name="${k}"][value="${old.data[k]}"]`);if(radio)radio.checked=true}else f.elements[k].value=old.data[k]||''}})}if(!f.querySelector('input[name="mode"]:checked'))f.querySelector('input[name="mode"][value="full"]').checked=true;const syncMode=()=>{const mode=f.querySelector('input[name="mode"]:checked')?.value||'full';document.getElementById('fullFields').classList.toggle('off',mode==='teaser')};f.querySelectorAll('input[name="mode"]').forEach(r=>r.addEventListener('change',syncMode));syncMode();setupVisualUpload(cat);renderVisualInsights(cat);f.addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(f));localStorage.setItem(STORE,JSON.stringify({category:cat,style:st,data}));location.href=`?preview=${st}&category=${cat}`})}
function readDraft(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){return null}}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function validUrl(s){return /^https?:\/\//i.test((s||'').trim())}
function niceDates(s=''){return s.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/(\d{4})\/(\d{1,2})\/(\d{1,2})/g,'$1年$2月$3日'))}
function previewPage(cat,st){const c=CATS[cat],p=findPattern(cat,st),draft=readDraft();if(!c||!p||!draft||draft.category!==cat||draft.style!==st){app.innerHTML=makerHeader()+`<main class="wrap formArea"><h1>プレビュー情報がありません</h1><p class="sub">先に公演情報を入力してください。</p><a class="backLink" href="?category=${cat||''}">入力画面へ戻る</a></main>`;return}const d=draft.data||{};const full=d.mode!=='teaser';document.title=(d.title||'公演プレビュー');document.body.className='previewBody';const dates=niceDates(d.date);const cast=(d.cast||'').split('\n').map(x=>x.trim()).filter(Boolean);const staff=(d.staff||'').split('\n').map(x=>x.trim()).filter(Boolean);const official=validUrl(d.official)?d.official:'';const ticket=validUrl(d.ticket)?d.ticket:'';const contact=validUrl(d.contact)?d.contact:'';const visual=getVisual();const showHeroTitle=!visual;const heroExtra=showHeroTitle?(st==='scramble'?`<div class="scrambleDisplay" id="scrambleText"></div>`:`<div class="siteTitle">${esc(d.title||'公演タイトル')}</div>`):`<h1 class="srOnly">${esc(d.title||'公演タイトル')}</h1>`;const visualStyle=visual?`style="--visual-bg:url('${visual}')"`:'';const navLinks=full?`<a href="#story">STORY</a><a href="#cast">CAST</a><a href="#schedule">SCHEDULE</a><a href="#access">ACCESS</a>`:`<a href="#links">DETAIL / TICKET</a>`;const heroVisual=visual?`<div class="heroVisual"></div>`:'';const teaserBody=`<section class="contentSec" id="links"><div class="secInner"><div class="secLabel">PERFORMANCE</div><h2>公演情報</h2><div class="scheduleList">${dates.length?dates.map(x=>`<div class="scheduleItem">${esc(x)}</div>`).join(''):'<div class="scheduleItem">日程未入力</div>'}${d.venue?`<div class="scheduleItem"><b>会場</b><br>${esc(d.venue)}</div>`:''}${d.price?`<div class="scheduleItem"><b>料金</b><br>${esc(d.price)}</div>`:''}</div><div class="linkRow">${official?`<a class="bigLink" href="${esc(official)}" target="_blank" rel="noopener">公演詳細を見る →</a>`:'<span class="bigLink disabled">公演詳細URL 未設定</span>'}${ticket?`<a class="bigLink primaryLink" href="${esc(ticket)}" target="_blank" rel="noopener"><span>チケットを予約する →</span></a>`:'<span class="bigLink disabled">予約ページ準備中</span>'}</div></div></section>`;const fullBody=`${d.story?`<section class="contentSec" id="story"><div class="secInner"><div class="secLabel">STORY</div><h2>あらすじ</h2><div class="storyText">${esc(d.story)}</div></div></section>`:''}${cast.length?`<section class="contentSec" id="cast"><div class="secInner"><div class="secLabel">CAST</div><h2>出演</h2><div class="castGrid">${cast.map(x=>`<div class="castName">${esc(x)}</div>`).join('')}</div></div></section>`:''}${staff.length?`<section class="contentSec" id="staff"><div class="secInner"><div class="secLabel">STAFF</div><h2>スタッフ</h2><div class="scheduleList">${staff.map(x=>`<div class="scheduleItem">${esc(x)}</div>`).join('')}</div></div></section>`:''}<section class="contentSec" id="schedule"><div class="secInner"><div class="secLabel">SCHEDULE</div><h2>公演日程</h2><div class="scheduleList">${dates.length?dates.map(x=>`<div class="scheduleItem">${esc(x)}</div>`).join(''):'<div class="scheduleItem">日程未入力</div>'}</div>${d.price?`<div class="scheduleItem"><b>料金</b><br>${esc(d.price)}</div>`:''}</div></section><section class="contentSec" id="access"><div class="secInner"><div class="secLabel">ACCESS / TICKET</div><h2>会場・予約</h2><div class="storyText">${esc(d.venue||'会場未入力')}</div><div class="linkRow">${official?`<a class="bigLink" href="${esc(official)}" target="_blank" rel="noopener">公演詳細を見る →</a>`:''}${ticket?`<a class="bigLink primaryLink" href="${esc(ticket)}" target="_blank" rel="noopener"><span>チケットを予約する →</span></a>`:'<span class="bigLink disabled">予約ページ準備中</span>'}${contact?`<a class="bigLink" href="${esc(contact)}" target="_blank" rel="noopener">お問い合わせ / SNS →</a>`:''}</div></div></section>`;const titleClass=visual?' flyerFirst':'';app.innerHTML=`<div class="site ${cat}" ${visualStyle}><nav class="siteNav"><div>${esc(d.org||'PERFORMANCE')}</div><div class="navlinks">${navLinks}</div></nav><section class="siteHero ${st} ${visual?'hasVisual':''}${titleClass}">${heroVisual}<div class="heroInner"><div class="siteOrg">${esc(d.org||'')}</div>${heroExtra}<div class="siteMeta">${esc(d.venue||'')} ${dates[0]?' / '+esc(dates[0]):''}</div></div><div class="scrollCue">SCROLL</div></section>${full?fullBody:teaserBody}</div><div class="previewTools"><a class="editBtn" href="?category=${cat}&style=${st}">← 入力を直す</a><div class="previewRight"><button class="replayBtn" id="replayOpening" type="button">↻ OPENING</button><button class="publishBtn" id="publishPage" type="button">${full?'このサイトを公開する':'この入口を公開する'}</button></div></div><div class="checkoutBackdrop" id="checkoutBackdrop" aria-hidden="true"><section class="checkoutPanel"><div class="checkoutHead"><div><div class="kicker">PUBLISH</div><h2>気に入ったら、公開。</h2></div><button class="checkoutCloseX" id="checkoutCloseX" type="button">×</button></div><p class="checkoutCopy">完成画面の確認までは無料です。公開するときだけ料金が発生する設計です。</p><div class="checkoutPlan"><div class="checkoutPlanTop"><div><div class="planName">${full?'FULL SITE':'TEASER'}</div><h3>${esc(d.title||'この公演ページ')}</h3></div><div class="checkoutPrice">${full?'¥980':'¥0'}${full?'<small>税込・仮価格</small>':'<small>無料公開想定</small>'}</div></div><ul class="checkoutList"><li>この完成デザインのまま公開</li><li>公開URLを発行</li><li>あとから公演情報を修正できる想定</li></ul></div>${full?`<div class="paymentBox"><h4>支払い方法</h4><div class="payMethods"><span class="payMethod">クレジット / デビット</span><span class="payMethod">スマホ決済</span><span class="payMethod">その他のキャッシュレス</span></div></div><button class="checkoutGo" id="checkoutGo" type="button">決済画面へ進む →</button>`:`<button class="checkoutGo" id="checkoutGo" type="button">無料で公開する →</button>`}<div class="checkoutDemo" id="checkoutDemo"><b>${full?'ここから決済サービスにつなぐ。':'ここから公開処理につなぐ。'}</b><p>${full?'本番ではこのボタンからStripe等の安全な決済画面へ移動し、支払い完了後に公開URLを発行します。今は試作版なので料金は発生しません。':'本番ではここで公開URLを発行します。今は試作版なので実際の公開処理は行いません。'}</p><button id="checkoutDemoBack" type="button">完成画面に戻る</button></div><button class="checkoutBack" id="checkoutBack" type="button">まだ公開しない</button><p class="checkoutNote">※ 現在は決済UIのデモです。カード番号などの決済情報をこのサイト自身で保存する設計にはしません。</p></section></div>`;if(st==='scramble'&&showHeroTitle)runScramble(d.title||'STAGE');playOpening(cat,st,d.title||'STAGE',visual);document.getElementById('replayOpening').addEventListener('click',()=>playOpening(cat,st,d.title||'STAGE',visual));setupPublishFlow()}
function setupPublishFlow(){const modal=document.getElementById('checkoutBackdrop'),open=document.getElementById('publishPage'),closeX=document.getElementById('checkoutCloseX'),back=document.getElementById('checkoutBack'),go=document.getElementById('checkoutGo'),demo=document.getElementById('checkoutDemo'),demoBack=document.getElementById('checkoutDemoBack');if(!modal||!open)return;const close=()=>{modal.classList.remove('show');modal.setAttribute('aria-hidden','true');document.body.style.overflow='';if(demo)demo.classList.remove('show')};open.addEventListener('click',()=>{modal.classList.add('show');modal.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'});closeX?.addEventListener('click',close);back?.addEventListener('click',close);modal.addEventListener('click',e=>{if(e.target===modal)close()});go?.addEventListener('click',()=>{demo?.classList.add('show');demo?.scrollIntoView({behavior:'smooth',block:'nearest'})});demoBack?.addEventListener('click',close)}
function playOpening(cat,st,title,visual){document.querySelectorAll('.openingLayer').forEach(x=>x.remove());const layer=document.createElement('div');const visualOnly=!!visual;layer.className=`openingLayer ${st} out${visualOnly?' visualOnly':''}`;if(visual){layer.innerHTML=`<div class="openingVisual" style="--opening-visual:url('${visual}')"></div>`}else{layer.innerHTML=st==='scramble'?`<div class="openingTitle" id="openingScramble"></div>`:`<div class="openingTitle">${esc(title)}</div>`}document.body.appendChild(layer);if(st==='scramble'&&!visualOnly)runOpeningScramble(title);setTimeout(()=>{if(layer.parentNode)layer.remove()},3300)}
function runScramble(finalText){const el=document.getElementById('scrambleText');if(!el)return;scrambleInto(el,finalText,34,55)}
function runOpeningScramble(finalText){const el=document.getElementById('openingScramble');if(!el)return;scrambleInto(el,finalText,28,48)}
function scrambleInto(el,finalText,max,delay){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#?%';let frame=0;const timer=setInterval(()=>{frame++;const lock=Math.floor((frame/max)*finalText.length);el.textContent=[...finalText].map((ch,i)=>ch===' '?' ':i<lock?ch:chars[Math.floor(Math.random()*chars.length)]).join('');if(frame>=max){el.textContent=finalText;clearInterval(timer)}},delay)}
if(preview)previewPage(category,preview);else if(diagnose)diagnosis();else if(category&&style)form(category,style);else if(category)choose(category);else home();
</script>
</body>
</html>
