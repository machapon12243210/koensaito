<!doctype html>
<html lang="ja">
<head>

<title>公演サイトメーカー</title>
<style>
:root{--bg:#0a0a0d;--fg:#f6f3ed;--muted:#96969f;--line:#ffffff18;--panel:#141419;--r:24px}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.7}a{color:inherit;text-decoration:none}button,input,textarea{font:inherit}button{cursor:pointer}.wrap{width:min(1060px,calc(100% - 34px));margin:auto}.makerHead{position:sticky;top:0;z-index:60;height:58px;padding:0 17px;display:flex;align-items:center;justify-content:space-between;background:#0a0a0ddd;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.makerHead a{font-size:12px;font-weight:900}.badge{font-size:10px;border:1px solid #ffffff2b;border-radius:999px;padding:6px 9px;color:#c8c8ce}.intro{padding:92px 0 34px}.kicker{font-size:11px;letter-spacing:.16em;color:#8e8e97}.intro h1,.selectHero h1{font-size:clamp(48px,12vw,104px);line-height:.88;letter-spacing:-.07em;margin:10px 0 18px}.intro p,.selectHero p{font-size:14px;color:#aaa;max-width:700px;margin:0}.categories{display:grid;gap:14px;padding:0 0 80px}.cat{position:relative;min-height:420px;border-radius:28px;overflow:hidden;border:1px solid var(--line);padding:24px;display:flex;align-items:flex-end}.catIn{position:relative;z-index:4;max-width:670px}.cat h2{font-size:clamp(48px,12vw,96px);line-height:.82;letter-spacing:-.07em;margin:4px 0 12px}.cat h3{font-size:18px;margin:0 0 8px}.cat p{font-size:13px;color:#d1d0d5;margin:0 0 16px}.pill{display:inline-block;border:1px solid #ffffff30;background:#1119;backdrop-filter:blur(8px);padding:9px 12px;border-radius:999px;font-size:11px}
.revealBg{background:#020203}.revealBg:before{content:"";position:absolute;width:310px;height:310px;border-radius:50%;right:6%;top:12%;background:radial-gradient(circle,#fff9 0,#fff2 26%,transparent 68%);filter:blur(5px);animation:floatLight 5s ease-in-out infinite alternate}@keyframes floatLight{to{transform:translate(-42vw,28vh) scale(.75)}}
.flowBg{background:#071331}.flowBg:before,.flowBg:after{content:"";position:absolute;width:125vw;height:55vh;left:-18vw;border-radius:50%;mix-blend-mode:screen}.flowBg:before{top:-22vh;background:linear-gradient(90deg,#5b4cff,#0ee4ff);animation:flowOne 6s ease-in-out infinite alternate}.flowBg:after{bottom:-23vh;background:linear-gradient(90deg,#ff4f9b,#794bff);animation:flowTwo 7s ease-in-out infinite alternate}@keyframes flowOne{to{transform:translate(18vw,25vh) rotate(16deg)}}@keyframes flowTwo{to{transform:translate(-16vw,-20vh) rotate(-13deg)}}
.typeBg{background:#eeeae0;color:#111}.typeBg:before{content:"ことばが\A舞台になる。";white-space:pre;position:absolute;left:4%;top:7%;font-family:Georgia,"Yu Mincho",serif;font-size:clamp(70px,20vw,190px);line-height:.82;letter-spacing:-.09em;color:#1112}.typeBg p{color:#333}.typeBg .pill{background:#fff8;border-color:#1112;color:#111}
.posterBg{background:#111117}.posterBg:before{content:"";position:absolute;width:min(68vw,540px);aspect-ratio:3/4;right:-4%;top:2%;background:linear-gradient(145deg,#ffd82f 0 44%,#ff526d 44% 71%,#f3eddf 71%);transform:rotate(8deg);box-shadow:0 30px 90px #000b}.posterBg:after{content:"PLAY\A2026";white-space:pre;position:absolute;right:4%;top:11%;font:900 clamp(42px,11vw,105px)/.82 -apple-system,sans-serif;letter-spacing:-.08em;color:#111}
.quietBg{background:#efede6;color:#111}.quietBg:before{content:"";position:absolute;right:10%;top:14%;width:34%;height:39%;background:linear-gradient(145deg,#d4d0c5,#b7b3aa)}.quietBg:after{content:"";position:absolute;right:6%;top:11%;height:66%;width:1px;background:#1113}.quietBg p{color:#333}.quietBg .pill{background:#fff8;border-color:#1112;color:#111}
.selectHero{padding:95px 0 28px}.backLink{display:inline-flex;margin-top:20px;font-size:11px;border:1px solid #ffffff25;border-radius:999px;padding:8px 11px;color:#ccc}.patterns{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:70px}.pattern{min-height:330px;border:1px solid var(--line);border-radius:24px;padding:18px;background:#121217;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}.pattern .num{font-size:10px;letter-spacing:.16em;color:#777}.pattern h3{font-size:28px;letter-spacing:-.04em;margin:7px 0 6px}.pattern p{font-size:12px;color:#aaa;margin:0}.demo{height:150px;margin-top:18px;border-radius:18px;position:relative;overflow:hidden;background:#09090c}.demo span{position:absolute;z-index:2}.demoSpot:before{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,#fff9,transparent 68%);top:25px;left:10%;animation:spotDemo 3.5s ease-in-out infinite alternate}@keyframes spotDemo{to{left:68%}}.demoSpot span{left:20px;bottom:18px;font-weight:800}.demoFade span{inset:0;display:grid;place-items:center;font-size:30px;font-weight:900;animation:fadeDemo 2.8s ease-in-out infinite}@keyframes fadeDemo{0%,100%{opacity:.08}50%{opacity:1}}.demoTear:before,.demoTear:after{content:"";position:absolute;inset:0;background:#020203;transition:.2s}.demoTear:before{clip-path:polygon(0 0,52% 0,45% 100%,0 100%);animation:tearL 3s ease-in-out infinite alternate}.demoTear:after{clip-path:polygon(52% 0,100% 0,100% 100%,45% 100%);animation:tearR 3s ease-in-out infinite alternate}.demoTear span{inset:0;display:grid;place-items:center;font-weight:900}@keyframes tearL{to{transform:translateX(-35%) rotate(-4deg)}}@keyframes tearR{to{transform:translateX(35%) rotate(4deg)}}
.demoWave{background:#06143b}.demoWave:before{content:"";position:absolute;width:190%;height:120%;left:-45%;top:45%;border-radius:45%;background:#5b4cff;animation:wDemo 3s linear infinite}@keyframes wDemo{to{transform:rotate(360deg)}}.demoGradient{background:linear-gradient(120deg,#5b4cff,#0ee4ff,#ff4f9b,#5b4cff);background-size:280% 280%;animation:gDemo 5s ease infinite}@keyframes gDemo{50%{background-position:100% 50%}}.demoInk:before{content:"";position:absolute;width:40px;height:40px;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%);background:#764fff;filter:blur(3px);animation:inkDemo 3s ease-in-out infinite}@keyframes inkDemo{50%{width:240px;height:240px;border-radius:42% 58% 51% 49%/58% 46% 54% 42%}}
.demoType{background:#eeeae0;color:#111}.demoType span{inset:0;display:grid;place-items:center;font:900 28px/1 -apple-system,sans-serif}.demoTypewriter span{width:max-content;height:34px;left:20px;top:58px;overflow:hidden;white-space:nowrap;border-right:2px solid;animation:typing 3s steps(6,end) infinite}@keyframes typing{0%,15%{width:0}70%,100%{width:125px}}.demoLetters span{letter-spacing:.35em;animation:letterFade 2.8s ease-in-out infinite}@keyframes letterFade{0%,100%{opacity:.1;letter-spacing:.6em}50%{opacity:1;letter-spacing:.12em}}.demoScramble span{animation:scramble 1.5s steps(1) infinite}@keyframes scramble{0%{font-size:0}0%:after{content:"X4#8?"}25%:after{content:"S?A9E"}50%:after{content:"ST4GE"}75%,100%:after{content:"STAGE"}}.demoScramble span:after{content:"STAGE";font-size:28px}
.demoPoster{background:#19191f}.miniPoster{position:absolute!important;width:90px;height:120px;left:50%;top:15px;transform:translateX(-50%);background:linear-gradient(145deg,#ffd82f 0 45%,#ff526d 45% 72%,#f4eee0 72%);box-shadow:0 10px 30px #0008}.demoZoom .miniPoster{animation:pZoom 3s ease-in-out infinite alternate}@keyframes pZoom{to{transform:translateX(-50%) scale(1.55)}}.demoSplit .miniPoster{clip-path:inset(0);animation:pSplit 3s ease-in-out infinite alternate}@keyframes pSplit{to{clip-path:inset(18% 18% 18% 18%);transform:translateX(-50%) rotate(6deg) scale(1.2)}}.demoStack .miniPoster{box-shadow:-12px 9px 0 #54c6ff,-24px 18px 0 #7655ff;animation:pStack 3s ease-in-out infinite alternate}@keyframes pStack{to{transform:translate(-25%,-4px) rotate(8deg)}}
.demoQuiet{background:#efede6;color:#111}.demoQuiet span{inset:0;display:grid;place-items:center;font-family:Georgia,"Yu Mincho",serif;font-size:25px}.demoSlow span{animation:qFade 4s ease-in-out infinite}@keyframes qFade{0%,100%{opacity:.15}50%{opacity:1}}.demoParallax:before{content:"";position:absolute;width:55%;height:65%;right:10%;top:18%;background:#b9b4aa;animation:para 4s ease-in-out infinite alternate}.demoParallax span{transform:translateX(-35px);animation:paraT 4s ease-in-out infinite alternate}@keyframes para{to{transform:translateY(13px)}}@keyframes paraT{to{transform:translate(-35px,-10px)}}.demoFocus:before{content:"";position:absolute;inset:20px;background:linear-gradient(145deg,#cfcac0,#aaa69e);filter:blur(11px);animation:focus 4s ease-in-out infinite}@keyframes focus{50%{filter:blur(0)}}
.patternBtn{width:100%;border:0;border-radius:14px;padding:13px 14px;margin-top:14px;background:#f2efe9;color:#111;font-weight:900}.formArea{padding:84px 0 70px}.formArea h1{font-size:clamp(40px,10vw,76px);letter-spacing:-.06em;line-height:.95;margin:8px 0 14px}.formArea .sub{color:#999;font-size:13px;margin:0 0 22px}.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.full{grid-column:1/-1}.field label{font-size:12px;font-weight:900}.field small{font-size:10px;color:#7f7f88}.field input,.field textarea{width:100%;border:1px solid #ffffff1b;background:#15151a;color:#fff;border-radius:14px;padding:14px;outline:none}.field textarea{min-height:105px;resize:vertical}.goPreview{grid-column:1/-1;border:0;border-radius:16px;padding:17px;background:#f2efe9;color:#111;font-weight:900;margin-top:7px}.note{margin-top:14px;color:#777;font-size:11px}.previewBody{margin:0}.site{min-height:100svh;overflow:hidden}.siteNav{position:fixed;z-index:70;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:10px;letter-spacing:.08em;mix-blend-mode:difference;color:#fff}.siteNav .navlinks{display:flex;gap:13px}.siteHero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:88px 22px 44px;overflow:hidden}.heroInner{position:relative;z-index:5;width:min(980px,100%);margin:auto}.siteOrg{font-size:11px;letter-spacing:.18em;opacity:.7}.siteTitle{font-size:clamp(58px,16vw,142px);line-height:.82;letter-spacing:-.075em;margin:8px 0 20px;max-width:980px}.siteMeta{font-size:13px;white-space:pre-line}.scrollCue{position:absolute;right:18px;bottom:20px;font-size:9px;letter-spacing:.16em;writing-mode:vertical-rl;opacity:.55}.contentSec{padding:95px 20px}.secInner{width:min(850px,100%);margin:auto}.secLabel{font-size:10px;letter-spacing:.18em;opacity:.5}.contentSec h2{font-size:clamp(36px,9vw,70px);letter-spacing:-.05em;line-height:.95;margin:9px 0 26px}.storyText{font-size:15px;line-height:2.1;white-space:pre-line}.castGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.castName{padding:18px 0;border-top:1px solid currentColor;font-size:17px}.scheduleList{display:grid;gap:9px}.scheduleItem{padding:15px 0;border-top:1px solid currentColor;white-space:pre-line}.linkRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}.bigLink{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 19px;border-radius:999px;border:1px solid currentColor;font-size:12px;font-weight:900}.primaryLink{background:currentColor}.primaryLink span{filter:invert(1)}.disabled{opacity:.38;pointer-events:none}.previewTools{position:fixed;z-index:90;left:12px;bottom:12px}.editBtn{display:inline-flex;background:#111d;color:#fff;border:1px solid #ffffff26;border-radius:999px;padding:9px 12px;font-size:10px;backdrop-filter:blur(10px)}
/* Preview themes */
.site.reveal{background:#020203;color:#f7f4ee}.site.flow{background:#06122f;color:#fff}.site.type{background:#eeeae0;color:#111}.site.poster{background:#111116;color:#f8f3eb}.site.quiet{background:#efede6;color:#111}
.siteHero.spotlight:before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,#fff8 0,#fff2 29%,transparent 70%);filter:blur(4px);top:10%;left:-10%;animation:siteSpot 7s ease-in-out infinite alternate}@keyframes siteSpot{to{left:65%;top:35%}}.siteHero.fadein .heroInner{animation:siteFade 2.7s ease both}@keyframes siteFade{from{opacity:0;filter:blur(15px);transform:translateY(20px)}to{opacity:1;filter:blur(0);transform:none}}.siteHero.tear:before,.siteHero.tear:after{content:"";position:absolute;inset:0;background:#020203;z-index:8;animation:openTear 2.1s 1s ease forwards}.siteHero.tear:before{clip-path:polygon(0 0,52% 0,45% 100%,0 100%)}.siteHero.tear:after{clip-path:polygon(52% 0,100% 0,100% 100%,45% 100%)}@keyframes openTear{to{transform:translateX(var(--x)) rotate(var(--r));opacity:.85}}.siteHero.tear:before{--x:-70%;--r:-4deg}.siteHero.tear:after{--x:70%;--r:4deg}.siteHero.tear .heroInner{opacity:0;animation:showAfter 1s 2s forwards}@keyframes showAfter{to{opacity:1}}
.siteHero.wave:before{content:"";position:absolute;width:170vw;height:110vw;max-height:1000px;left:-35vw;top:45%;background:linear-gradient(135deg,#5c4cff,#0ee4ff);border-radius:44%;animation:siteWave 12s linear infinite}@keyframes siteWave{to{transform:rotate(360deg)}}.siteHero.gradient{background:linear-gradient(120deg,#5b4cff,#0ee4ff,#ff4f9b,#5b4cff);background-size:350% 350%;animation:siteGradient 11s ease infinite}@keyframes siteGradient{50%{background-position:100% 50%}}.siteHero.ink:before{content:"";position:absolute;width:100px;height:100px;border-radius:50%;background:#7250ff;left:50%;top:50%;transform:translate(-50%,-50%);filter:blur(5px);animation:siteInk 5s ease-in-out infinite alternate}@keyframes siteInk{to{width:130vw;height:110vw;border-radius:42% 58% 51% 49%/58% 46% 54% 42%}}
.siteHero.typewriter .siteTitle{width:max-content;max-width:100%;overflow:hidden;white-space:nowrap;border-right:3px solid;animation:siteTyping 2.8s steps(12,end) both}@keyframes siteTyping{from{width:0}to{width:100%}}.siteHero.letters .siteTitle{animation:siteLetters 2.3s ease both}@keyframes siteLetters{from{opacity:0;letter-spacing:.35em;filter:blur(8px)}to{opacity:1;letter-spacing:-.075em;filter:blur(0)}}.siteHero.scramble .siteTitle{opacity:0}.scrambleDisplay{font-size:clamp(58px,16vw,142px);line-height:.82;letter-spacing:-.075em;margin:8px 0 20px;font-weight:800}
.siteHero.posterZoom:before,.siteHero.posterSplit:before,.siteHero.posterStack:before{content:"";position:absolute;width:min(68vw,520px);aspect-ratio:3/4;right:5%;top:8%;background:linear-gradient(145deg,#ffd82f 0 44%,#ff526d 44% 71%,#f3eddf 71%);box-shadow:0 25px 70px #000b}.siteHero.posterZoom:before{animation:sitePZoom 6s ease-in-out infinite alternate}@keyframes sitePZoom{to{transform:scale(1.22) rotate(4deg)}}.siteHero.posterSplit:before{animation:sitePSplit 4s ease-in-out infinite alternate}@keyframes sitePSplit{to{clip-path:inset(15% 12% 18% 10%);transform:rotate(8deg) scale(1.05)}}.siteHero.posterStack:before{box-shadow:-18px 12px 0 #52c8ff,-36px 24px 0 #7656ff,0 25px 70px #000b;animation:sitePStack 4s ease-in-out infinite alternate}@keyframes sitePStack{to{transform:translate(-25px,10px) rotate(-6deg)}}
.siteHero.slowfade .heroInner{animation:qSiteFade 3.4s ease both}@keyframes qSiteFade{from{opacity:0}to{opacity:1}}.siteHero.parallax:before{content:"";position:absolute;width:48%;height:52%;right:8%;top:17%;background:linear-gradient(145deg,#d2cdc2,#aba79f);animation:qParaImg 5s ease-in-out infinite alternate}.siteHero.parallax .heroInner{animation:qParaText 5s ease-in-out infinite alternate}@keyframes qParaImg{to{transform:translateY(18px)}}@keyframes qParaText{to{transform:translateY(-10px)}}.siteHero.focus:before{content:"";position:absolute;inset:11% 8% 18% 34%;background:linear-gradient(145deg,#d1ccc2,#aaa69e);filter:blur(14px);animation:qFocus 4.5s ease forwards}@keyframes qFocus{to{filter:blur(0)}}
.site.type .contentSec,.site.quiet .contentSec{border-top:1px solid #1112}.site.reveal .contentSec,.site.flow .contentSec,.site.poster .contentSec{border-top:1px solid #fff1}
@media(max-width:760px){.patterns{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full,.goPreview{grid-column:auto}.castGrid{grid-template-columns:1fr}.cat{min-height:440px}.siteNav .navlinks{display:none}.siteTitle{font-size:clamp(52px,17vw,94px)}.siteHero.posterZoom:before,.siteHero.posterSplit:before,.siteHero.posterStack:before{width:70vw;right:-15%;opacity:.76}.scrambleDisplay{font-size:clamp(52px,17vw,94px)}}
</style>

<body>
<div id="app"></div>
<script>
const CATS={
reveal:{name:'隠れて現れる',en:'REVEAL',desc:'最初は見えないものが、光・暗闇・裂け目などから現れます。ミステリー、幻想、ホラー、シリアス作品向け。',bg:'revealBg'},
flow:{name:'流れて変わる',en:'FLOW',desc:'色や形が画面を横切り、舞台転換のように景色が変わります。ダンス、音楽劇、抽象的な作品向け。',bg:'flowBg'},
type:{name:'言葉で魅せる',en:'TYPE',desc:'写真に頼らず、タイトルや言葉そのものを動かして作品の入口を作ります。会話劇、文芸、朗読に強い。',bg:'typeBg'},
poster:{name:'フライヤーを活かす',en:'POSTER',desc:'公演フライヤーを主役にした入口。すでにある宣伝ビジュアルを活かしたい公演向け。',bg:'posterBg'},
quiet:{name:'静かに魅せる',en:'QUIET',desc:'余白、写真、文字を丁寧に見せる静かな入口。会話劇、文芸、美術性の高い作品向け。',bg:'quietBg'}
};
const PATTERNS={
reveal:[['spotlight','SPOTLIGHT','光が当たった場所から見える','demoSpot'],['fadein','FADE FROM DARK','暗闇からゆっくり浮かび上がる','demoFade'],['tear','TEAR','黒い幕が裂けて作品が現れる','demoTear']],
flow:[['wave','WAVE','大きな波が画面を動かす','demoWave'],['gradient','GRADIENT','色の流れが絶えず変化する','demoGradient'],['ink','INK','インクが広がり画面を満たす','demoInk']],
type:[['typewriter','TYPEWRITER','タイトルを一文字ずつ打ち出す','demoType demoTypewriter'],['letters','FADE LETTERS','文字がばらけた状態から揃う','demoType demoLetters'],['scramble','SCRAMBLE','意味不明な文字が正しいタイトルになる','demoType demoScramble']],
poster:[['posterZoom','ZOOM','ポスターへゆっくり近づく','demoPoster demoZoom'],['posterSplit','SPLIT','フライヤーが切り取られたように変化する','demoPoster demoSplit'],['posterStack','STACK','複数のポスターが重なって動く','demoPoster demoStack']],
quiet:[['slowfade','SLOW FADE','何もない空間から静かに現れる','demoQuiet demoSlow'],['parallax','PARALLAX','写真と文字が少し違う速度で動く','demoQuiet demoParallax'],['focus','FOCUS','ぼやけた世界にゆっくりピントが合う','demoQuiet demoFocus']]
};
const params=new URLSearchParams(location.search);
const app=document.getElementById('app');
const category=params.get('category');
const style=params.get('style');
const preview=params.get('preview');
const STORE='koensaito_draft_v15';
function makerHeader(){return `<header class="makerHead"><a href="./">公演サイトメーカー</a><span class="badge">試作版</span></header>`}
function home(){document.title='公演サイトメーカー';app.innerHTML=makerHeader()+`<main class="wrap"><section class="intro"><div class="kicker">舞台・公演向け</div><h1>作品の入口を、<br>演出から選ぶ。</h1><p>SNSや告知から来た人を、数秒で作品世界へ。入口ページの先から、公式サイトや予約ページへつなげます。</p></section><section class="categories">${Object.entries(CATS).map(([k,c],i)=>`<a class="cat ${c.bg}" href="?category=${k}"><div class="catIn"><div class="kicker">0${i+1} / ${c.en}</div><h2>${c.en}</h2><h3>${c.name}</h3><p>${c.desc}</p><span class="pill">3つの演出を見る →</span></div></a>`).join('')}</section></main>`}
function choose(cat){const c=CATS[cat];if(!c)return home();document.title=`${c.name}｜公演サイトメーカー`;app.innerHTML=makerHeader()+`<main class="wrap"><section class="selectHero"><div class="kicker">${c.en}</div><h1>${c.name}</h1><p>${c.desc}</p><a class="backLink" href="./">← 5つのジャンルへ戻る</a></section><section class="patterns">${PATTERNS[cat].map((p,i)=>`<article class="pattern"><div><div class="num">0${i+1}</div><h3>${p[1]}</h3><p>${p[2]}</p><div class="demo ${p[3]}">${cat==='poster'?'<span class="miniPoster"></span>':'<span>STAGE</span>'}</div></div><a class="patternBtn" href="?category=${cat}&style=${p[0]}">この演出を使う</a></article>`).join('')}</section></main>`}
function form(cat,st){const c=CATS[cat],p=(PATTERNS[cat]||[]).find(x=>x[0]===st);if(!c||!p)return home();const old=readDraft();document.title=`${p[1]}｜公演サイトメーカー`;app.innerHTML=makerHeader()+`<main class="wrap formArea"><div class="kicker">${c.en} / ${p[1]}</div><h1>公演情報を入れる</h1><p class="sub">ここで作るのは“公演の入口”。完成ページから公式サイトとチケットページへつなぎます。</p><form class="form" id="makerForm"><div class="field"><label>公演タイトル</label><input name="title" required placeholder="例：夜明けを待つ部屋"></div><div class="field"><label>団体名</label><input name="org" placeholder="例：劇団サンプル"></div><div class="field"><label>公演日程</label><textarea name="date" placeholder="例：2026/1/1 19:00&#10;2026/1/2 13:00"></textarea><small>複数回ある場合は改行してください。</small></div><div class="field"><label>会場</label><textarea name="venue" placeholder="例：東京 ○○スタジオ"></textarea></div><div class="field"><label>料金（任意）</label><input name="price" placeholder="例：前売 3,000円 / 当日 3,500円"></div><div class="field"><label>公式サイト・公演詳細URL</label><input name="official" inputmode="url" placeholder="https://..."></div><div class="field full"><label>チケット予約URL</label><input name="ticket" inputmode="url" placeholder="https://..."></div><div class="field full"><label>あらすじ（任意）</label><textarea name="story" placeholder="作品の紹介文。空欄でも完成ページは成立します。"></textarea></div><div class="field full"><label>出演者（任意）</label><textarea name="cast" placeholder="一人ずつ改行"></textarea></div><button class="goPreview" type="submit">別ページで完成サイトを見る →</button></form><div class="note">入力した内容はこの端末のブラウザ内に一時保存します。この試作版では公開されません。</div><a class="backLink" href="?category=${cat}">← 演出を選び直す</a></main>`;
const f=document.getElementById('makerForm'); if(old&&old.category===cat&&old.style===st){Object.keys(old.data||{}).forEach(k=>{if(f.elements[k])f.elements[k].value=old.data[k]||''})}
f.addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(f));localStorage.setItem(STORE,JSON.stringify({category:cat,style:st,data}));location.href=`?preview=${st}&category=${cat}`})}
function readDraft(){try{return JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){return null}}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function validUrl(s){return /^https?:\/\//i.test((s||'').trim())}
function niceDates(s=''){return s.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/(\d{4})\/(\d{1,2})\/(\d{1,2})/g,'$1年$2月$3日'))}
function previewPage(cat,st){const c=CATS[cat],p=(PATTERNS[cat]||[]).find(x=>x[0]===st),draft=readDraft();if(!c||!p||!draft||draft.category!==cat||draft.style!==st){app.innerHTML=makerHeader()+`<main class="wrap formArea"><h1>プレビュー情報がありません</h1><p class="sub">先に公演情報を入力してください。</p><a class="backLink" href="?category=${cat||''}">入力画面へ戻る</a></main>`;return}const d=draft.data||{};document.title=(d.title||'公演プレビュー');document.body.className='previewBody';const dates=niceDates(d.date);const cast=(d.cast||'').split('\n').map(x=>x.trim()).filter(Boolean);const official=validUrl(d.official)?d.official:'';const ticket=validUrl(d.ticket)?d.ticket:'';const heroExtra=st==='scramble'?`<div class="scrambleDisplay" id="scrambleText"></div>`:`<div class="siteTitle">${esc(d.title||'公演タイトル')}</div>`;app.innerHTML=`<div class="site ${cat}"><nav class="siteNav"><div>${esc(d.org||'PERFORMANCE')}</div><div class="navlinks"><a href="#story">STORY</a><a href="#cast">CAST</a><a href="#schedule">SCHEDULE</a><a href="#access">ACCESS</a></div></nav><section class="siteHero ${st}"><div class="heroInner"><div class="siteOrg">${esc(d.org||'')}</div>${heroExtra}<div class="siteMeta">${esc(d.venue||'')} ${dates[0]?' / '+esc(dates[0]):''}</div></div><div class="scrollCue">SCROLL</div></section>${d.story?`<section class="contentSec" id="story"><div class="secInner"><div class="secLabel">STORY</div><h2>あらすじ</h2><div class="storyText">${esc(d.story)}</div></div></section>`:''}${cast.length?`<section class="contentSec" id="cast"><div class="secInner"><div class="secLabel">CAST</div><h2>出演</h2><div class="castGrid">${cast.map(x=>`<div class="castName">${esc(x)}</div>`).join('')}</div></div></section>`:''}<section class="contentSec" id="schedule"><div class="secInner"><div class="secLabel">SCHEDULE</div><h2>公演日程</h2><div class="scheduleList">${dates.length?dates.map(x=>`<div class="scheduleItem">${esc(x)}</div>`).join(''):'<div class="scheduleItem">日程未入力</div>'}</div>${d.price?`<div class="scheduleItem"><b>料金</b><br>${esc(d.price)}</div>`:''}</div></section><section class="contentSec" id="access"><div class="secInner"><div class="secLabel">ACCESS</div><h2>会場</h2><div class="storyText">${esc(d.venue||'会場未入力')}</div><div class="linkRow">${official?`<a class="bigLink" href="${esc(official)}" target="_blank" rel="noopener">公演詳細を見る →</a>`:'<span class="bigLink disabled">公演詳細URL 未設定</span>'}${ticket?`<a class="bigLink primaryLink" href="${esc(ticket)}" target="_blank" rel="noopener"><span>チケットを予約する →</span></a>`:'<span class="bigLink disabled">予約ページ準備中</span>'}</div></div></section></div><div class="previewTools"><a class="editBtn" href="?category=${cat}&style=${st}">← 入力を直す</a></div>`;if(st==='scramble')runScramble(d.title||'STAGE')}
function runScramble(finalText){const el=document.getElementById('scrambleText');if(!el)return;const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#?%';let frame=0;const max=34;const timer=setInterval(()=>{frame++;const lock=Math.floor((frame/max)*finalText.length);el.textContent=[...finalText].map((ch,i)=>ch===' '? ' ' : i<lock?ch:chars[Math.floor(Math.random()*chars.length)]).join('');if(frame>=max){el.textContent=finalText;clearInterval(timer)}},55)}
if(preview)previewPage(category,preview);else if(category&&style)form(category,style);else if(category)choose(category);else home();
</script>
</body>
</html>
